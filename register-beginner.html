<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register for Beginner Batch | Bliss Out Dance Studio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="navbar">
      <div class="logo">
        <img src="images/logo.png" alt="Bliss Out Dance Studio Logo" />
      </div>

      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <nav id="nav-menu">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="classes.html">Classes</a></li>
          <li><a href="index.html#contact">Contact</a></li>
        </ul>
      </nav>
    </header>

    <!-- Registration Section -->
    <section class="form-section fade-in">
      <h1 class="classes-title">Beginner Batch Registration</h1>

      <p class="classes-intro">
        You are registering for the <strong>Beginner Garba Batch</strong><br />
        Timing: <strong>8:30 PM – 10:00 PM</strong>
      </p>

      <div class="section-divider"></div>

      <!-- Registration Form -->
      <div class="form-card">
        <form id="registrationForm">
          <input
            type="hidden"
            name="batch"
            value="Beginner Batch (8:30 PM – 10:00 PM)"
          />

          <input type="text" name="name" placeholder="Full Name" required />

          <input type="number" name="age" placeholder="Age" required />

          <select name="gender" required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
          </select>

          <textarea name="address" placeholder="Address" required></textarea>

          <input
            type="tel"
            name="whatsapp"
            pattern="[0-9]{10}"
            placeholder="WhatsApp Number"
            required
          />

          <label style="text-align: left; font-size: 14px; opacity: 0.8">
            Upload Photo
          </label>
          <input type="file" accept="image/*" />

          <button type="submit">Register Now</button>
        </form>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <p>© 2025 Bliss Out Dance Studio, Khandwa</p>
    </footer>

    <script src="script.js"></script>

    <div class="nav-backdrop"></div>
  </body>
</html>
