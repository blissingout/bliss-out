<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment | Bliss Out Dance Studio</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>

<header class="navbar">
    <div class="logo">
        <span class="logo-mark"></span>
        <span class="logo-text">Bliss Out</span>
    </div>
</header>

<section class="classes fade-in">
    <h1 class="classes-title">Confirm Your Registration</h1>

    <div class="section-divider"></div>

    <div class="contact-form" id="paymentSummary">

        <h3 style="margin-bottom:10px;">Payment Details</h3>

        <p id="batchInfo"></p>
        <p id="amountInfo" style="font-weight:bold;"></p>

        <div style="margin:25px 0;">
            <p style="opacity:0.85; font-size:14px;">
                Pay using UPI QR or UPI ID below
            </p>

            <!-- QR Placeholder -->
            <div style="
                margin: 15px auto;
                width: 200px;
                height: 200px;
                background-color: #000;
                display:flex;
                align-items:center;
                justify-content:center;
                border-radius:10px;
            ">
                <span style="opacity:0.6;">QR CODE</span>
            </div>

            <p style="font-size:14px; opacity:0.9;">
                UPI ID: <strong>blissout@upi</strong>
            </p>
        </div>

        <p style="font-size:13px; opacity:0.7;">
            After completing payment, click <strong>Confirm Payment</strong>.
        </p>

    </div>

    <button id="confirmPaymentBtn" style="
        margin-top: 30px;
        padding: 14px;
        font-size: 16px;
        background-color: #e94560;
        color: white;
        border: none;
        cursor: pointer;
    ">
        Confirm Payment
    </button>
</section>

<script src="script.js"></script>
</body>
</html>
